name: Build Block Game Maker APK

on:
  push:
  workflow_dispatch:        # lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Builds :player first (the empty game shell), embeds it in the maker app, then builds the maker app.
      - name: Build the app
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BlockGameMaker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
